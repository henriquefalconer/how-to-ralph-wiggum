<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Pretendard', sans-serif;
      background: #0f0f0f;
      padding: 28pt 36pt;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8pt;">
    <div style="display: flex; align-items: center; gap: 12pt;">
      <p style="display: inline-block; padding: 4pt 10pt; background: #6366f1; color: #fff; border-radius: 4pt; font-size: 8pt; font-weight: 600;">THE IDEA</p>
      <h2 style="font-size: 18pt; font-weight: 600; color: #ffffff;">How Ralph Works</h2>
    </div>
    <p style="font-size: 10pt; color: #666;">03</p>
  </div>

  <p style="font-size: 11pt; color: #b0b0b0; line-height: 1.5; margin-bottom: 6pt;">
    Nobody carries the whole job. Ralph runs one short pass, throws it away, and starts again clean — as many times as it takes.
  </p>

  <!-- The loop -->
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 2pt 0;">
    <img src="./assets/how-ralph-works.svg" alt="The Ralph loop: a fresh worker picks the one thing that matters most, does it, checks it, writes down what changed, and goes again until nothing is left."
         style="max-width: 100%; max-height: 100%; object-fit: contain;">
  </div>

  <!-- Footer -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 8pt; border-top: 1px solid #252525;">
    <p style="font-size: 9pt; color: #666;">Ralph</p>
    <p style="font-size: 9pt; color: #6366f1;">No pass is long enough to go bad · nothing important lives only in the worker</p>
    <p style="font-size: 9pt; color: #666;">Demo 2026</p>
  </div>
</body>
</html>
