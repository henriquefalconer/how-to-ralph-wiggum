<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 720pt;
      height: 405pt;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
        Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      padding: 32pt 48pt;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <!-- Main content centered -->
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <div style="width: 18pt; height: 18pt; background: #ffffff; border-radius: 3pt; display: flex; align-items: center; justify-content: center; margin-bottom: 20pt;">
      <p style="color: #0f0f0f; font-size: 10pt; font-weight: 700;">R</p>
    </div>
    <h1 style="font-size: 44pt; font-weight: 600; color: #ffffff; letter-spacing: -0.02em; margin-bottom: 32pt;">
      Thank you!
    </h1>
    <div style="display: flex; gap: 40pt;">
      <div style="text-align: center;">
        <p style="font-size: 9pt; color: #666; margin-bottom: 4pt;">The whole idea</p>
        <p style="font-size: 11pt; font-weight: 500; color: #6366f1;">Start empty · do one thing · write it down · go again</p>
      </div>
      <div style="text-align: center;">
        <p style="font-size: 9pt; color: #666; margin-bottom: 4pt;">Why it holds</p>
        <p style="font-size: 11pt; font-weight: 500; color: #6366f1;">You're on the loop instead of in the loop</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div style="display: flex; justify-content: center; padding-top: 10pt; border-top: 1px solid #252525;">
    <p style="font-size: 9pt; color: #666;">Educational purposes only &middot; Demo 2026</p>
  </div>
</body>
</html>
